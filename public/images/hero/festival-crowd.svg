<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Sky & Stage Haze Gradient -->
    <linearGradient id="skyHaze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5EE" stop-opacity="0.95" />
      <stop offset="25%" stop-color="#FFE0B2" stop-opacity="0.8" />
      <stop offset="55%" stop-color="#FFAB91" stop-opacity="0.6" />
      <stop offset="85%" stop-color="#E8372A" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1" />
    </linearGradient>

    <!-- Golden Stage Spotlight -->
    <radialGradient id="sunSpot" cx="65%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#FFF9C4" stop-opacity="1" />
      <stop offset="35%" stop-color="#FFD54F" stop-opacity="0.75" />
      <stop offset="65%" stop-color="#FF7043" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- Beam 1 -->
    <linearGradient id="beam1" x1="50%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FFE082" stop-opacity="0" />
    </linearGradient>

    <!-- Beam 2 -->
    <linearGradient id="beam2" x1="50%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A65" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#FF8A65" stop-opacity="0" />
    </linearGradient>

    <!-- Crowd Silhouette Gradient -->
    <linearGradient id="crowdGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D1412" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#1A0A09" stop-opacity="0.96" />
      <stop offset="100%" stop-color="#0E0505" stop-opacity="1" />
    </linearGradient>

    <!-- Stage Truss -->
    <linearGradient id="trussGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3E2723" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#1A0A09" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Background Warm Sky -->
  <rect width="1200" height="800" fill="url(#skyHaze)" />

  <!-- Radial Sun/Stage Glow -->
  <circle cx="780" cy="240" r="420" fill="url(#sunSpot)" />

  <!-- Stage Light Beams -->
  <polygon points="760,120 400,800 600,800" fill="url(#beam1)" />
  <polygon points="790,120 700,800 950,800" fill="url(#beam2)" />
  <polygon points="820,120 900,800 1200,800" fill="url(#beam1)" opacity="0.6" />

  <!-- Stage Truss Structure & Lighting Rig (top-right) -->
  <g opacity="0.45" stroke="#4A2820" stroke-width="2.5" fill="none">
    <line x1="620" y1="80" x2="1150" y2="80" stroke-width="6" stroke="#2D1412" />
    <line x1="620" y1="120" x2="1150" y2="120" stroke-width="4" stroke="#2D1412" />
    <path d="M640,80 L680,120 L720,80 L760,120 L800,80 L840,120 L880,80 L920,120 L960,80 L1000,120 L1040,80 L1080,120 L1120,80" />
    <!-- Stage spotlights hanging -->
    <rect x="670" y="120" width="16" height="22" rx="3" fill="#2D1412" />
    <circle cx="678" cy="144" r="8" fill="#FFF176" opacity="0.9" />
    <rect x="750" y="120" width="18" height="25" rx="3" fill="#2D1412" />
    <circle cx="759" cy="147" r="10" fill="#FFD54F" opacity="0.95" />
    <rect x="830" y="120" width="18" height="25" rx="3" fill="#2D1412" />
    <circle cx="839" cy="147" r="10" fill="#FF7043" opacity="0.9" />
    <rect x="910" y="120" width="16" height="22" rx="3" fill="#2D1412" />
    <circle cx="918" cy="144" r="8" fill="#FFF176" opacity="0.9" />
  </g>

  <!-- Golden floating sparks / festival bokeh -->
  <g opacity="0.65">
    <circle cx="650" cy="320" r="6" fill="#FFF59D" />
    <circle cx="720" cy="280" r="12" fill="#FFE082" opacity="0.5" />
    <circle cx="820" cy="310" r="8" fill="#FFCC80" />
    <circle cx="760" cy="360" r="16" fill="#FFAB91" opacity="0.4" />
    <circle cx="880" cy="270" r="9" fill="#FFF9C4" />
    <circle cx="940" cy="340" r="14" fill="#FFE082" opacity="0.5" />
    <circle cx="600" cy="400" r="10" fill="#FFD54F" opacity="0.4" />
    <circle cx="700" cy="430" r="22" fill="#FF8A65" opacity="0.25" />
    <circle cx="850" cy="420" r="18" fill="#FFB74D" opacity="0.3" />
    <circle cx="990" cy="390" r="12" fill="#FFF176" opacity="0.4" />
  </g>

  <!-- Festival Crowd Silhouettes - Layer 1 (Distant) -->
  <path d="M420,580 Q450,560 480,575 Q510,555 540,570 Q570,550 600,565 Q630,545 660,560 Q690,540 720,555 Q750,535 780,550 Q810,530 840,548 Q870,535 900,552 Q930,538 960,555 Q990,542 1020,558 Q1050,545 1080,560 Q1110,548 1140,565 Q1170,550 1200,560 L1200,800 L420,800 Z" fill="#4E2722" opacity="0.55" />

  <!-- Festival Crowd Silhouettes - Layer 2 (Midground with arms up) -->
  <g fill="#2D1412" opacity="0.82">
    <!-- Heads and shoulders -->
    <path d="M380,630 C410,610 440,615 470,625 C500,605 530,610 560,620 C590,600 620,608 650,618 C680,598 710,602 740,615 C770,595 800,600 830,612 C860,592 890,598 920,610 C950,590 980,595 1010,608 C1040,592 1070,600 1100,615 C1130,602 1160,610 1200,620 L1200,800 L380,800 Z" />
    <!-- Raised hands in midground -->
    <path d="M520,610 L524,530 Q528,518 534,518 Q540,518 542,530 L546,610 Z" />
    <path d="M536,540 L550,528 Q556,524 560,528 Q562,534 554,545 L546,570 Z" />
    <path d="M730,605 L726,515 Q724,500 732,500 Q740,500 742,515 L746,605 Z" />
    <path d="M740,530 L755,510 Q762,504 766,510 Q768,516 758,532 L748,560 Z" />
    <path d="M890,600 L885,505 Q882,490 892,490 Q900,490 902,505 L908,600 Z" />
    <path d="M904,520 L922,502 Q930,496 934,504 Q934,512 922,528 L912,555 Z" />
    <path d="M1060,610 L1065,525 Q1068,512 1076,512 Q1082,512 1082,525 L1080,610 Z" />
  </g>

  <!-- Festival Crowd Silhouettes - Layer 3 (Foreground prominent hero silhouette, girl on shoulders / hands up celebrating) -->
  <g fill="url(#crowdGrad)">
    <!-- Prominent festival attendee silhouette with arm raised -->
    <!-- Torso and shoulders -->
    <path d="M820,800 C810,720 815,670 835,635 C855,605 885,595 915,595 C945,595 975,605 995,635 C1015,670 1020,720 1010,800 Z" />
    <!-- Head with flowing hair -->
    <circle cx="915" cy="545" r="38" />
    <path d="M885,545 C870,570 860,610 870,645 C885,635 895,615 900,580 Z" />
    <path d="M945,545 C960,570 970,610 960,645 C945,635 935,615 930,580 Z" />
    <!-- Left arm raised high in euphoria -->
    <path d="M845,625 C835,570 820,510 805,450 C798,420 802,395 812,392 C822,389 828,405 832,435 C845,490 860,545 870,605 Z" />
    <!-- Wristband and hand -->
    <circle cx="810" cy="390" r="10" />
    <!-- Spread fingers in celebration -->
    <path d="M805,385 L795,355 Q798,348 804,350 L808,382 Z" />
    <path d="M810,382 L808,345 Q812,340 818,342 L816,382 Z" />
    <path d="M816,382 L822,348 Q826,344 831,348 L823,385 Z" />
    <path d="M818,385 L834,360 Q840,358 842,364 L825,388 Z" />

    <!-- Right arm slightly angled -->
    <path d="M985,625 C1005,580 1030,530 1055,485 C1065,465 1075,455 1084,458 C1092,462 1090,478 1080,498 C1060,540 1035,585 1015,630 Z" />

    <!-- More foreground crowd heads and shoulders -->
    <path d="M300,800 C320,740 350,710 390,705 C430,700 465,725 480,800 Z" />
    <circle cx="390" cy="655" r="34" />

    <path d="M470,800 C490,730 525,695 570,690 C615,685 650,715 670,800 Z" />
    <circle cx="570" cy="640" r="36" />

    <path d="M640,800 C660,715 700,670 755,665 C805,660 840,695 860,800 Z" />
    <circle cx="750" cy="610" r="35" />

    <path d="M990,800 C1010,720 1045,680 1095,675 C1145,670 1180,710 1200,800 Z" />
    <circle cx="1090" cy="625" r="35" />
  </g>

  <!-- Soft vignette around edges for smooth blending into white UI -->
  <rect width="1200" height="800" fill="url(#skyHaze)" opacity="0.1" />
</svg>

